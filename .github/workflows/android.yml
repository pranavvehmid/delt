# Builds the DELT Android app (APK) and publishes it on the "app-latest" release,
# so it can be downloaded straight to a phone from GitHub.
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/delt-release.p12"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/delt-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: delt
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Publish to the app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DELT.apk
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest DELT.apk \
            --title "DELT for Android (build ${{ github.run_number }})" \
            --notes "Download **DELT.apk** on your phone, open it, and allow installing from your browser if Android asks. Sign in with your VIT Google account." \
            --latest
