<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Two screens: Inbox with every mail, and Deadlines found in mail">
<style>
  .bg { fill: #fafaf9; } .ink { fill: #1c1917; } .rule { stroke: #1c1917; } .red { fill: #c8102e; } .redline { stroke: #c8102e; }
  .inv { fill: #fafaf9; } .invs { stroke: #fafaf9; }
  text { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .l { font-weight: 300; } .r { font-weight: 400; } .m { font-weight: 500; } .h { font-weight: 800; }
  .caps { font-weight: 500; letter-spacing: .12em; }
  .num { font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161412; } .ink { fill: #f5f4f2; } .rule { stroke: #f5f4f2; } .inv { fill: #161412; } .invs { stroke: #161412; }
    .red { fill: #ff4d5e; } .redline { stroke: #ff4d5e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  
  .ib { animation: ib 8s cubic-bezier(.22,1,.36,1) infinite; } @keyframes ib { 0%, 44% { fill-opacity: 1; } 52%, 94% { fill-opacity: .2; } 100% { fill-opacity: 1; } }
  .dl { animation: dl 8s cubic-bezier(.22,1,.36,1) infinite; } @keyframes dl { 0%, 44% { fill-opacity: .2; } 52%, 94% { fill-opacity: 1; } 100% { fill-opacity: .2; } }
  .pi { animation: pi 8s cubic-bezier(.22,1,.36,1) infinite; } @keyframes pi { 0%, 44% { opacity: 1; transform: none; } 50%, 96% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; } }
  .pd { opacity: 0; animation: pd 8s cubic-bezier(.22,1,.36,1) infinite; } @keyframes pd { 0%, 48% { opacity: 0; transform: translateY(10px); } 56%, 94% { opacity: 1; transform: none; } 100% { opacity: 0; } }</style>
<rect width="1200" height="440" class="bg"/>

  <text x="72" y="64" class="ink caps" font-size="13" fill-opacity=".45">TWO SCREENS</text>
  <text x="66" y="140" class="ink l ib" font-size="76" letter-spacing="-3">Inbox</text>
  <text x="300" y="140" class="ink l dl" font-size="76" letter-spacing="-3">Deadlines</text>
  <g class="pi"><g transform="translate(72 196)"><g class="">
    <rect x="0" y="-6" width="20" height="3" class="red"/>
    <text x="0" y="22" class="ink r num" font-size="15" fill-opacity="0.60">9:41</text>
    <text x="84" y="2" class="ink caps" font-size="12" fill-opacity="0.60">CONTROLLER OF EXAMINATIONS</text>
    <text x="84" y="30" class="ink m" font-size="22" fill-opacity="1">CAT-1 schedule and seating</text>
  </g></g><g transform="translate(72 268)"><g class="">
    
    <text x="0" y="22" class="ink r num" font-size="15" fill-opacity="0.43">9:12</text>
    <text x="84" y="2" class="ink caps" font-size="12" fill-opacity="0.43">ACM-VIT</text>
    <text x="84" y="30" class="ink r" font-size="22" fill-opacity="0.72">HackVIT closes Friday</text>
  </g></g><g transform="translate(72 340)"><g class="">
    
    <text x="0" y="22" class="ink r num" font-size="15" fill-opacity="0.29">8:02</text>
    <text x="84" y="2" class="ink caps" font-size="12" fill-opacity="0.29">SCOPE</text>
    <text x="84" y="30" class="ink r" font-size="22" fill-opacity="0.48">Guest lecture on quantum computing</text>
  </g></g></g>
  <g class="pd"><g transform="translate(72 206)">
      <text x="0" y="22" class="red l num" font-size="44" letter-spacing="-2">5</text>
      <text x="2" y="42" class="ink caps" font-size="11" fill-opacity=".45">NOV</text>
      <text x="84" y="10" class="ink r" font-size="22">DA-2 for BCSE101</text>
      <text x="84" y="36" class="red caps" font-size="12" fill-opacity="1">TOMORROW 11:59 PM</text>
    </g><g transform="translate(72 278)">
      <text x="0" y="22" class="ink l num" font-size="44" letter-spacing="-2">6</text>
      <text x="2" y="42" class="ink caps" font-size="11" fill-opacity=".45">NOV</text>
      <text x="84" y="10" class="ink r" font-size="22">CAT-1 exam</text>
      <text x="84" y="36" class="ink caps" font-size="12" fill-opacity="0.55">IN 2 DAYS</text>
    </g><g transform="translate(72 350)">
      <text x="0" y="22" class="ink l num" font-size="44" letter-spacing="-2">9</text>
      <text x="2" y="42" class="ink caps" font-size="11" fill-opacity=".45">NOV</text>
      <text x="84" y="10" class="ink r" font-size="22">FFCS registration closes</text>
      <text x="84" y="36" class="ink caps" font-size="12" fill-opacity="0.55">IN 5 DAYS</text>
    </g></g>
</svg>
