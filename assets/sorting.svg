<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Each mail is read and printed darker the more it matters: urgent, priority, later, noise">
<style>
  .bg { fill: #fafaf9; } .ink { fill: #1c1917; } .rule { stroke: #1c1917; } .red { fill: #c8102e; } .redline { stroke: #c8102e; }
  .inv { fill: #fafaf9; } .invs { stroke: #fafaf9; }
  text { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .l { font-weight: 300; } .r { font-weight: 400; } .m { font-weight: 500; } .h { font-weight: 800; }
  .caps { font-weight: 500; letter-spacing: .12em; }
  .num { font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161412; } .ink { fill: #f5f4f2; } .rule { stroke: #f5f4f2; } .inv { fill: #161412; } .invs { stroke: #161412; }
    .red { fill: #ff4d5e; } .redline { stroke: #ff4d5e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  
  .scan { animation: scan 10s linear infinite; } @keyframes scan { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(310px); opacity: 1; } 74%, 100% { transform: translateY(310px); opacity: 0; } }
  .s0 { animation: s0 10s ease-out infinite; } @keyframes s0 { 0%, 3% { opacity: .18; } 7%, 94% { opacity: 1; } 100% { opacity: .18; } }
  .lab0 { opacity: 0; animation: lab0 10s ease-out infinite; } @keyframes lab0 { 0%, 3% { opacity: 0; transform: translateX(-8px); } 8%, 94% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .s1 { animation: s1 10s ease-out infinite; } @keyframes s1 { 0%, 17% { opacity: .18; } 21%, 94% { opacity: 1; } 100% { opacity: .18; } }
  .lab1 { opacity: 0; animation: lab1 10s ease-out infinite; } @keyframes lab1 { 0%, 17% { opacity: 0; transform: translateX(-8px); } 22%, 94% { opacity: 0.72; transform: none; } 100% { opacity: 0; } }
  .s2 { animation: s2 10s ease-out infinite; } @keyframes s2 { 0%, 31% { opacity: .18; } 35%, 94% { opacity: 1; } 100% { opacity: .18; } }
  .lab2 { opacity: 0; animation: lab2 10s ease-out infinite; } @keyframes lab2 { 0%, 31% { opacity: 0; transform: translateX(-8px); } 36%, 94% { opacity: 0.48; transform: none; } 100% { opacity: 0; } }
  .s3 { animation: s3 10s ease-out infinite; } @keyframes s3 { 0%, 45% { opacity: .18; } 49%, 94% { opacity: 1; } 100% { opacity: .18; } }
  .lab3 { opacity: 0; animation: lab3 10s ease-out infinite; } @keyframes lab3 { 0%, 45% { opacity: 0; transform: translateX(-8px); } 50%, 94% { opacity: 0.45; transform: none; } 100% { opacity: 0; } }
  .s4 { animation: s4 10s ease-out infinite; } @keyframes s4 { 0%, 59% { opacity: .18; } 63%, 94% { opacity: 1; } 100% { opacity: .18; } }
  .lab4 { opacity: 0; animation: lab4 10s ease-out infinite; } @keyframes lab4 { 0%, 59% { opacity: 0; transform: translateX(-8px); } 64%, 94% { opacity: 1; transform: none; } 100% { opacity: 0; } }</style>
<rect width="1200" height="470" class="bg"/>

  <text x="72" y="64" class="ink caps" font-size="13" fill-opacity=".45">HOW DELT SORTS</text>
  <text x="72" y="108" class="ink l" font-size="34" letter-spacing="-.5">The more a mail matters, the darker it prints.</text>
  <g class="scan"><line x1="72" y1="140" x2="1128" y2="140" class="redline" stroke-width="1.5"/></g>
  <g transform="translate(72 150)"><g class="s0">
    <rect x="0" y="-6" width="20" height="3" class="red"/>
    <text x="0" y="22" class="ink r num" font-size="15" fill-opacity="0.60">Mon</text>
    <text x="84" y="2" class="ink caps" font-size="12" fill-opacity="0.60">ACADEMICS</text>
    <text x="84" y="30" class="ink m" font-size="22" fill-opacity="1">FFCS registration opens tomorrow</text>
  </g></g>
  <text x="1128" y="180" text-anchor="end" class="red caps lab0" font-size="13">URGENT</text><g transform="translate(72 212)"><g class="s1">
    
    <text x="0" y="22" class="ink r num" font-size="15" fill-opacity="0.43">Mon</text>
    <text x="84" y="2" class="ink caps" font-size="12" fill-opacity="0.43">OFFICE OF DSW</text>
    <text x="84" y="30" class="ink r" font-size="22" fill-opacity="0.72">Holiday notice: Deepavali</text>
  </g></g>
  <text x="1128" y="242" text-anchor="end" class="ink caps lab1" font-size="13">PRIORITY</text><g transform="translate(72 274)"><g class="s2">
    
    <text x="0" y="22" class="ink r num" font-size="15" fill-opacity="0.29">Sun</text>
    <text x="84" y="2" class="ink caps" font-size="12" fill-opacity="0.29">DEAN SCOPE</text>
    <text x="84" y="30" class="ink r" font-size="22" fill-opacity="0.48">Congratulations to Team Phoenix</text>
  </g></g>
  <text x="1128" y="304" text-anchor="end" class="ink caps lab2" font-size="13">LATER</text><g transform="translate(72 336)"><g class="s3">
    
    <text x="0" y="22" class="ink r num" font-size="15" fill-opacity="0.18">Sun</text>
    <text x="84" y="2" class="ink caps" font-size="12" fill-opacity="0.18">COURSERA</text>
    <text x="84" y="30" class="ink r" font-size="22" fill-opacity="0.3">Learn Python today, 40% off</text>
  </g></g>
  <text x="1128" y="366" text-anchor="end" class="ink caps lab3" font-size="13">NOISE</text><g transform="translate(72 398)"><g class="s4">
    <rect x="0" y="-6" width="20" height="3" class="red"/>
    <text x="0" y="22" class="ink r num" font-size="15" fill-opacity="0.60">Sat</text>
    <text x="84" y="2" class="ink caps" font-size="12" fill-opacity="0.60">PROF. RAO</text>
    <text x="84" y="30" class="ink m" font-size="22" fill-opacity="1">DA-2 due Friday 11:59 pm</text>
  </g></g>
  <text x="1128" y="428" text-anchor="end" class="red caps lab4" font-size="13">URGENT</text>
</svg>
