<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Download DELT for Android">
<style>
  .bg { fill: #fafaf9; } .ink { fill: #1c1917; } .rule { stroke: #1c1917; } .red { fill: #c8102e; } .redline { stroke: #c8102e; }
  .inv { fill: #fafaf9; } .invs { stroke: #fafaf9; }
  text { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .l { font-weight: 300; } .r { font-weight: 400; } .m { font-weight: 500; } .h { font-weight: 800; }
  .caps { font-weight: 500; letter-spacing: .12em; }
  .num { font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161412; } .ink { fill: #f5f4f2; } .rule { stroke: #f5f4f2; } .inv { fill: #161412; } .invs { stroke: #161412; }
    .red { fill: #ff4d5e; } .redline { stroke: #ff4d5e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  
  .arrow { animation: arrow 1.6s ease-in-out infinite; } @keyframes arrow { 0%, 100% { transform: translateY(-5px); } 50% { transform: translateY(5px); } }
  .sweep { transform-origin: 320px 0; animation: sweep 3.2s cubic-bezier(.22,1,.36,1) infinite; } @keyframes sweep { 0% { transform: scaleX(0); } 60%, 100% { transform: scaleX(1); } }</style>
<rect width="1200" height="190" class="bg"/>

  <rect x="320" y="30" width="560" height="92" class="ink"/>
  <g transform="translate(376 76)"><g class="arrow">
    <line x1="0" y1="-16" x2="0" y2="12" stroke-width="3" class="invs"/>
    <polyline points="-11,2 0,13 11,2" fill="none" stroke-width="3" class="invs"/>
  </g></g>
  <text x="420" y="85" class="inv r" font-size="26">Download for Android</text>
  <rect x="320" y="122" width="560" height="4" class="red sweep"/>
  <text x="600" y="166" text-anchor="middle" class="ink caps" font-size="12" fill-opacity=".5">APK · 400 KB · ANDROID 8 OR NEWER · FREE</text>
</svg>
