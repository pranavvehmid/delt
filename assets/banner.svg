" cy="144.0" r="9.5"/></g></g><g transform="translate(516 128)"><g class="ltr" style="animation-delay:0.37s" fill="#1b1238"><circle cx="0.0" cy="0.0" r="9.5"/><circle cx="24.0" cy="0.0" r="9.5"/><circle cx="48.0" cy="0.0" r="9.5"/><circle cx="72.0" cy="0.0" r="9.5"/><circle cx="96.0" cy="0.0" r="9.5"/><circle cx="48.0" cy="24.0" r="9.5"/><circle cx="48.0" cy="48.0" r="9.5"/><circle cx="48.0" cy="72.0" r="9.5"/><circle cx="48.0" cy="96.0" r="9.5"/><circle cx="48.0" cy="120.0" r="9.5"/><circle cx="48.0" cy="144.0" r="9.5"/></g></g>
<circle cx="640" cy="272" r="13" fill="#d71921" class="pulse"/>
