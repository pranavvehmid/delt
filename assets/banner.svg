  </g></g></g>
<g transform="translate(676 74)"><path d="M29 0c1.6 15 6.4 22.4 29 29-22.6 7-27.4 14.4-29 29-1.6-14.6-6.4-22-29-29C22.6 22.4 27.4 15 29 0z" fill="#1b1238" class="spin"/></g>
