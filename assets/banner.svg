<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="DELT: college mail, sorted by what needs you first">
<style>
  .bg { fill: #fafaf9; } .ink { fill: #1c1917; } .rule { stroke: #1c1917; } .red { fill: #c8102e; } .redline { stroke: #c8102e; }
  .inv { fill: #fafaf9; } .invs { stroke: #fafaf9; }
  text { font-family: "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .l { font-weight: 300; } .r { font-weight: 400; } .m { font-weight: 500; } .h { font-weight: 800; }
  .caps { font-weight: 500; letter-spacing: .12em; }
  .num { font-variant-numeric: tabular-nums; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161412; } .ink { fill: #f5f4f2; } .rule { stroke: #f5f4f2; } .inv { fill: #161412; } .invs { stroke: #161412; }
    .red { fill: #ff4d5e; } .redline { stroke: #ff4d5e; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  
  .dot { animation: dot 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes dot { 50% { transform: scale(1.25); } }
  .r0 { opacity: 0; animation: r0 9s cubic-bezier(.22,1,.36,1) infinite; }
  @keyframes r0 { 0%, 0% { opacity: 0; transform: translateY(14px); } 8%, 88% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  .r1 { opacity: 0; animation: r1 9s cubic-bezier(.22,1,.36,1) infinite; }
  @keyframes r1 { 0%, 7% { opacity: 0; transform: translateY(14px); } 15%, 88% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  .r2 { opacity: 0; animation: r2 9s cubic-bezier(.22,1,.36,1) infinite; }
  @keyframes r2 { 0%, 14% { opacity: 0; transform: translateY(14px); } 22%, 88% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  .r3 { opacity: 0; animation: r3 9s cubic-bezier(.22,1,.36,1) infinite; }
  @keyframes r3 { 0%, 21% { opacity: 0; transform: translateY(14px); } 29%, 88% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }
  .r4 { opacity: 0; animation: r4 9s cubic-bezier(.22,1,.36,1) infinite; }
  @keyframes r4 { 0%, 28% { opacity: 0; transform: translateY(14px); } 36%, 88% { opacity: 1; transform: none; } 96%, 100% { opacity: 0; } }</style>
<rect width="1200" height="520" class="bg"/>

  <text x="72" y="104" class="ink caps" font-size="14" fill-opacity=".5">VIT VELLORE</text>
  <text x="62" y="268" class="ink h" font-size="190" letter-spacing="-9">DELT<tspan class="red" dx="4">.</tspan></text>
  <text x="72" y="340" class="ink l" font-size="34" letter-spacing="-.5">College mail, sorted by</text>
  <text x="72" y="384" class="ink l" font-size="34" letter-spacing="-.5">what needs you first.</text>
  <line x1="72" y1="440" x2="560" y2="440" class="rule" stroke-opacity=".12"/>
  <text x="72" y="470" class="ink caps" font-size="12" fill-opacity=".45">URGENT · PRIORITY · LATER · NOISE</text>
  <line x1="600" y1="96" x2="600" y2="470" class="rule" stroke-opacity=".1"/>
  <text x="640" y="104" class="ink caps" font-size="12" fill-opacity=".45">TODAY</text>
  <g transform="translate(640 150)"><g class="r0">
    <rect x="0" y="-6" width="20" height="3" class="red"/>
    <text x="0" y="22" class="ink r num" font-size="15" fill-opacity="0.60">9:41</text>
    <text x="84" y="2" class="ink caps" font-size="12" fill-opacity="0.60">CONTROLLER OF EXAMINATIONS</text>
    <text x="84" y="30" class="ink m" font-size="22" fill-opacity="1">CAT-1 schedule and seating</text>
  </g></g><g transform="translate(640 222)"><g class="r1">
    
    <text x="0" y="22" class="ink r num" font-size="15" fill-opacity="0.43">9:12</text>
    <text x="84" y="2" class="ink caps" font-size="12" fill-opacity="0.43">ACM-VIT</text>
    <text x="84" y="30" class="ink r" font-size="22" fill-opacity="0.72">HackVIT closes Friday</text>
  </g></g><g transform="translate(640 294)"><g class="r2">
    <rect x="0" y="-6" width="20" height="3" class="red"/>
    <text x="0" y="22" class="ink r num" font-size="15" fill-opacity="0.60">8:30</text>
    <text x="84" y="2" class="ink caps" font-size="12" fill-opacity="0.60">ACCOUNTS</text>
    <text x="84" y="30" class="ink m" font-size="22" fill-opacity="1">Hostel fee due 15 Nov</text>
  </g></g><g transform="translate(640 366)"><g class="r3">
    
    <text x="0" y="22" class="ink r num" font-size="15" fill-opacity="0.29">8:02</text>
    <text x="84" y="2" class="ink caps" font-size="12" fill-opacity="0.29">SCOPE</text>
    <text x="84" y="30" class="ink r" font-size="22" fill-opacity="0.48">Guest lecture on quantum computing</text>
  </g></g><g transform="translate(640 438)"><g class="r4">
    
    <text x="0" y="22" class="ink r num" font-size="15" fill-opacity="0.18">7:15</text>
    <text x="84" y="2" class="ink caps" font-size="12" fill-opacity="0.18">VIT STORE</text>
    <text x="84" y="30" class="ink r" font-size="22" fill-opacity="0.3">50% off hoodies</text>
  </g></g>
</svg>
