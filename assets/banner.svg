<rect x="46" y="46" width="720" height="412" rx="30" fill="#f5c842" stroke="#0b0716" stroke-width="4"/>
<text x="84" y="96" class="m" font-size="15" fill="#1b1238" letter-spacing="1.5">VIT VELLORE · YOUR INBOX, SORTED</text>
